name: Skills CI

# Three cheap checks that run on every pull request. The full `claude plugin eval`
# suite (evals/README.md) is deliberately not here: every run spends tokens on an
# agent transcript, so it stays on demand.
on:
  pull_request:
    paths:
      - "skills/**"
      - "agents/**"
      - "commands/**"
      - "evals/**"
      - "catalogue.json"
      - "*.json"
      - ".claude-plugin/**"
      - ".agents/**"
      - ".github/workflows/skills-ci.yml"
      - ".github/scripts/**"
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Tier 0, structural validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate skills, agents, commands and eval files
        run: python3 evals/ci/validate.py

      - name: Test the eval harness
        run: python3 -m unittest discover -s evals/ci -p 'test_*.py'

  plugin:
    name: Claude plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The same checks the Claude plugin directory runs on a submission, so a
      # pull request that would be refused there fails here first.
      - name: Validate the plugin as the directory would
        run: claude plugin validate . --profile directory

