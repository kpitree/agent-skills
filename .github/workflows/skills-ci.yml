name: Skills CI

# One cheap check that runs on every pull request: the plugin validated as the
# directory validates it. The structural checks (tool names against the
# catalogue, routing cases, links, house style) run in KPI Tree's own test suite
# against this repository, since the directory accepts no scripts from a
# publisher it has not verified. The full plugin eval suite (evals/README.md) is
# deliberately not here: every run spends tokens on an agent transcript, so it
# stays on demand.
on:
  pull_request:
    paths:
      - "skills/**"
      - "agents/**"
      - "commands/**"
      - "evals/**"
      - "catalogue.json"
      - "*.json"
      - ".claude-plugin/**"
      - ".agents/**"
      - ".github/workflows/skills-ci.yml"
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Claude plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # The same checks the Claude plugin directory runs on a submission, so a
      # pull request that would be refused there fails here first.
      - name: Validate the plugin as the directory would
        run: claude plugin validate . --profile directory
